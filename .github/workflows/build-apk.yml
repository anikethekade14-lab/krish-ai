name: Build KRISH AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p android-project
          unzip -q krish-ai.zip -d android-project

      - name: Find Android project
        run: |
          echo "Searching for Gradle project..."
          find android-project -name "gradlew" -type f -print

      - name: Build APK
        run: |
          GRADLEW=$(find android-project -name "gradlew" -type f | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          cd "$PROJECT_DIR"

          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        run: |
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KRISH-AI-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
